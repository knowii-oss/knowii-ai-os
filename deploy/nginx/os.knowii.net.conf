# Web UI — os.knowii.net -> web container (127.0.0.1:3002)
# Sits behind the Cloudflare proxy (orange cloud); TLS below uses a
# Cloudflare origin certificate (no renewal ops). Self-hosters: replace
# the domain and switch ssl_certificate to certbot paths if not using CF.

server {
    listen 80;
    listen [::]:80;
    server_name os.knowii.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name os.knowii.net;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
