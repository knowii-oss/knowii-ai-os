# Vault git remotes — git.knowii.net -> forgejo container (127.0.0.1:3003)
# Deliberately NOT behind the Cloudflare proxy (DNS-only / grey cloud):
# the CF free-plan 100 MB request-body cap would break pushes of
# attachment-heavy vaults. TLS comes from certbot / Let's Encrypt instead.
#
# certbot: certbot --nginx -d git.knowii.net (paths below are certbot's).

server {
    listen 80;
    listen [::]:80;
    server_name git.knowii.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name git.knowii.net;

    ssl_certificate     /etc/letsencrypt/live/git.knowii.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/git.knowii.net/privkey.pem;

    # git-http pushes of large vaults: no practical body cap, long timeouts,
    # request buffering off so uploads stream to Forgejo instead of spooling.
    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }
}
