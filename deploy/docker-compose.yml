# Knowii AI OS — reference deployment
#
# This file IS the production layout (single Hetzner CX32 VPS) and the
# self-hosting reference: every service is a container bound to loopback;
# nginx on the host terminates TLS and routes domains to containers
# (see ./nginx/*.conf).
#
# Decisions behind this layout: project decision log 2026-08-17/19
# (single VPS, host nginx, hybrid TLS, restic->R2 backups, S3-backed LFS).

name: knowii-ai-os

services:
  engine:
    # Engine API + live rail (WebSocket/SSE). Built from packages/engine.
    image: ghcr.io/knowii-oss/knowii-ai-os-engine:${ENGINE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"

  web:
    # Web UI (serves the SPA / SSR front for os.<domain>).
    image: ghcr.io/knowii-oss/knowii-ai-os-web:${WEB_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      - engine
    ports:
      - "127.0.0.1:3002:3002"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowii}
      POSTGRES_USER: ${POSTGRES_USER:-knowii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports: only reachable from the compose network.

  forgejo:
    # Platform-hosted vault git remotes ("connect your vault").
    # LFS goes to S3-compatible object storage from day one (no local-disk phase).
    image: codeberg.org/forgejo/forgejo:12
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__DOMAIN: ${GIT_DOMAIN:-git.knowii.net}
      FORGEJO__server__ROOT_URL: https://${GIT_DOMAIN:-git.knowii.net}/
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__lfs__STORAGE_TYPE: minio
      FORGEJO__lfs__MINIO_ENDPOINT: ${LFS_S3_ENDPOINT:?set in .env}
      FORGEJO__lfs__MINIO_ACCESS_KEY_ID: ${LFS_S3_ACCESS_KEY:?set in .env}
      FORGEJO__lfs__MINIO_SECRET_ACCESS_KEY: ${LFS_S3_SECRET_KEY:?set in .env}
      FORGEJO__lfs__MINIO_BUCKET: ${LFS_S3_BUCKET:-knowii-vault-lfs}
      FORGEJO__lfs__MINIO_USE_SSL: "true"
    volumes:
      - forgejo-data:/data
    ports:
      - "127.0.0.1:3003:3000"
      - "2222:22" # git over SSH (optional; git-http via nginx is the default path)

volumes:
  postgres-data:
  forgejo-data:
